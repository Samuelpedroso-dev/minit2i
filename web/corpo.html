<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MiniT2I, gerador de imagens por texto treinado do zero, rodando no navegador.">
<title>MiniT2I</title>
<style>
:root{--fundo:#262624;--sup:#30302e;--sup2:#3a3a37;--linha:rgba(255,255,255,.09);--linha2:rgba(255,255,255,.16);
  --texto:#f3f2ee;--cinza:#a3a29c;--fraco:#73726c;--acento:#d97757;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:ui-serif,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.col{max-width:780px;margin:0 auto;padding:0 18px}

.marca{position:fixed;top:14px;left:18px;font-family:var(--serif);font-size:18px;color:var(--cinza);z-index:3}
.marca a{color:inherit;text-decoration:none}

main{padding:70px 18px 210px}
.vazio-feed{min-height:52vh;display:grid;place-items:center;text-align:center}
.vazio-feed h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,40px);color:var(--texto);margin:0}

.feed{display:flex;flex-direction:column;gap:34px}
.trab{display:flex;flex-direction:column;gap:12px;animation:sobe .45s ease both}
@keyframes sobe{from{opacity:0;transform:translateY(6px)}}
.bolha{align-self:flex-end;max-width:80%;background:var(--sup2);border-radius:18px;padding:10px 16px;line-height:1.5;word-break:break-word}
.bolha .ign{color:var(--fraco);text-decoration:line-through}
.resposta{display:flex;flex-direction:column;gap:8px;max-width:560px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cel{position:relative;aspect-ratio:1;background:var(--sup);border-radius:12px;overflow:hidden;cursor:zoom-in}
.cel canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.cel.gerando canvas{filter:saturate(.8)}
.cel .pct{position:absolute;right:8px;bottom:8px;font:11px var(--mono);background:rgba(0,0,0,.55);padding:2px 7px;border-radius:6px}
.cel .pct:empty{display:none}
.info{display:flex;flex-direction:column;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font:11.5px var(--mono);color:var(--fraco)}
.nota{font-size:12.5px;color:var(--fraco)}
.barra{height:2px;border-radius:2px;background:var(--linha);position:relative;overflow:hidden}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--acento);transition:width .2s}
.botoes{display:flex;gap:4px}
.bt{height:30px;padding:0 11px;border-radius:8px;border:0;background:transparent;color:var(--cinza);font-size:13px}
.bt:hover{background:var(--sup);color:var(--texto)}
.bt:disabled{opacity:.35;pointer-events:none}
.bt.cheio{background:var(--texto);color:#1d1d1b}

.comando{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:24px 0 calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--fundo) 30%)}
form.caixa-prompt{background:var(--sup);border:1px solid var(--linha2);border-radius:22px;padding:14px 14px 10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
form.caixa-prompt:focus-within{border-color:rgba(255,255,255,.26)}
textarea#prompt{width:100%;min-height:26px;max-height:200px;resize:none;background:none;border:0;outline:0;font-size:16px;line-height:1.5;padding:2px 4px}
textarea#prompt::placeholder{color:var(--fraco)}
.linha-bar{display:flex;align-items:center;gap:6px;margin-top:8px}
.icone{width:32px;height:32px;border-radius:9px;border:1px solid var(--linha2);background:none;display:grid;place-items:center;color:var(--cinza)}
.icone:hover,.icone[aria-expanded=true]{background:var(--sup2);color:var(--texto)}
.icone svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.direita{margin-left:auto;display:flex;align-items:center;gap:8px}
select#modelo{appearance:none;background:none;border:0;color:var(--cinza);font-size:13px;padding:6px 20px 6px 8px;border-radius:8px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);
  background-position:calc(100% - 10px) 52%,calc(100% - 6px) 52%;background-size:4px 4px;background-repeat:no-repeat}
select#modelo:hover{background-color:var(--sup2);color:var(--texto)}
select#modelo option{background:var(--sup)}
#gerar{width:32px;height:32px;border-radius:9px;border:0;display:grid;place-items:center;background:var(--acento);color:#fff}
#gerar:disabled{background:var(--sup2);color:var(--fraco);cursor:default}
#gerar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.estado{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:8px;font:11.5px var(--mono);color:var(--fraco);min-height:16px}
.ponto{width:5px;height:5px;border-radius:50%;background:var(--acento);animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{50%{opacity:.25}}
.ancora{position:relative}
.painel{position:absolute;left:0;bottom:42px;z-index:20;width:270px;background:var(--sup2);border:1px solid var(--linha2);border-radius:14px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}
.painel label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--cinza)}
.painel label span{display:flex;justify-content:space-between}
.painel b{font:500 12px var(--mono);color:var(--texto)}
.painel input[type=range]{width:100%;accent-color:var(--acento)}
.painel input[type=text]{background:var(--sup);border:1px solid var(--linha2);border-radius:8px;padding:6px 8px;font:12px var(--mono)}
.painel .nota{margin:0}

.caixa{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.caixa .dentro{width:min(92vw,540px);display:flex;flex-direction:column;gap:10px}
.caixa canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:14px;background:#000}
.caixa p{margin:0 2px;color:var(--cinza);font-size:14px}
@media (prefers-reduced-motion:reduce){.trab,.ponto{animation:none}}
</style>
</head>
<body>
<div class="marca"><a href="https://github.com/Samuelpedroso-dev/minit2i" target="_blank" rel="noopener">MiniT2I</a></div>

<main class="col">
  <div class="vazio-feed" id="vazio-feed"><h1>What should we create?</h1></div>
  <div class="feed" id="feed"></div>
  <div id="galeria"></div>
</main>

<div class="comando"><div class="col">
  <form class="caixa-prompt" id="form">
    <textarea id="prompt" rows="1" placeholder="Describe an image" disabled></textarea>
    <div class="linha-bar">
      <span class="ancora">
        <button type="button" class="icone" id="bt-ajustes" aria-expanded="false" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
        <div class="painel" id="painel" hidden>
          <label><span>Steps <b id="passos-v">30</b></span><input type="range" id="passos" min="8" max="50" value="30"></label>
          <label><span>Guidance <b id="guidance-v">4</b></span><input type="range" id="guidance" min="1" max="8" step="0.5" value="4"></label>
          <label><span>Seed</span><input type="text" id="semente" placeholder="random" inputmode="numeric"></label>
          <p class="nota" id="nucleos"></p>
        </div>
      </span>
      <button type="button" class="icone" id="surpresa" title="Random prompt"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></button>
      <div class="direita">
        <select id="modelo" title="Model"><option value="geral" disabled>MiniT2I General</option><option value="formas">MiniT2I Shapes</option></select>
        <button type="submit" id="gerar" disabled title="Generate"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
  </form>
  <div class="estado" id="estado"><span class="ponto"></span><span id="estado-txt">loading</span></div>
</div></div>

<div hidden>
  <button id="aba-formas"></button><button id="aba-geral" disabled></button><button id="aba-gerar"></button><button id="aba-galeria"></button>
  <a data-foco href="#"></a><div id="vocab"></div><div id="sugestoes"></div><div id="sessoes"></div><div id="miniatura"></div>
</div>

<div class="caixa" id="caixa" hidden><div class="dentro">
  <canvas id="grande" width="32" height="32"></canvas>
  <p id="caixa-txt"></p>
  <div class="botoes">
    <button class="bt cheio" id="baixar">Download</button>
    <button class="bt" id="variar">Variations</button>
    <button class="bt" id="fechar">Close</button>
  </div>
</div></div>

<script type="text/plain" id="fonte-trabalhador">{{TRABALHADOR}}</script>
<script>const GERAL_REPO = {{GERAL_REPO}};</script>
<script>{{GERAL}}</script>
<script>{{APP}}</script>
</body>
</html>
