<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MiniT2I, gerador de imagens por texto treinado do zero, rodando no navegador.">
<title>MiniT2I</title>
<style>
:root{--fundo:#262624;--sup:#30302e;--sup2:#3a3a37;--linha:rgba(255,255,255,.09);--linha2:rgba(255,255,255,.16);
  --texto:#f3f2ee;--cinza:#a3a29c;--fraco:#73726c;--acento:#d97757;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:ui-serif,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.col{max-width:780px;margin:0 auto;padding:0 18px}

.marca{position:fixed;top:14px;left:18px;font-family:var(--serif);font-size:18px;color:var(--cinza);z-index:3}
.marca a{color:inherit;text-decoration:none}

main{padding:70px 18px 210px}
.vazio-feed{min-height:52vh;display:grid;place-items:center;text-align:center}
.vazio-feed h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,40px);color:var(--texto);margin:0}

.feed{display:flex;flex-direction:column;gap:34px}
.trab{display:flex;flex-direction:column;gap:12px;animation:sobe .45s ease both}
@keyframes sobe{from{opacity:0;transform:translateY(6px)}}
.bolha{align-self:flex-end;max-width:80%;background:var(--sup2);border-radius:18px;padding:10px 16px;line-height:1.5;word-break:break-word}
.bolha .ign{color:var(--fraco);text-decoration:line-through}
.resposta{display:flex;flex-direction:column;gap:8px;max-width:560px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cel{position:relative;aspect-ratio:1;background:var(--sup);border-radius:12px;overflow:hidden;cursor:zoom-in}
.cel canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.cel.gerando canvas{filter:saturate(.8)}
.cel .pct{position:absolute;right:8px;bottom:8px;font:11px var(--mono);background:rgba(0,0,0,.55);padding:2px 7px;border-radius:6px}
.cel .pct:empty{display:none}
.info{display:flex;flex-direction:column;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font:11.5px var(--mono);color:var(--fraco)}
.nota{font-size:12.5px;color:var(--fraco)}
.barra{height:2px;border-radius:2px;background:var(--linha);position:relative;overflow:hidden}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--acento);transition:width .2s}
.botoes{display:flex;gap:4px}
.bt{height:30px;padding:0 11px;border-radius:8px;border:0;background:transparent;color:var(--cinza);font-size:13px}
.bt:hover{background:var(--sup);color:var(--texto)}
.bt:disabled{opacity:.35;pointer-events:none}
.bt.cheio{background:var(--texto);color:#1d1d1b}

.comando{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:24px 0 calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--fundo) 30%)}
form.caixa-prompt{background:var(--sup);border:1px solid var(--linha2);border-radius:22px;padding:14px 14px 10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
form.caixa-prompt:focus-within{border-color:rgba(255,255,255,.26)}
textarea#prompt{width:100%;min-height:26px;max-height:200px;resize:none;background:none;border:0;outline:0;font-size:16px;line-height:1.5;padding:2px 4px}
textarea#prompt::placeholder{color:var(--fraco)}
.linha-bar{display:flex;align-items:center;gap:6px;margin-top:8px}
.icone{width:32px;height:32px;border-radius:9px;border:1px solid var(--linha2);background:none;display:grid;place-items:center;color:var(--cinza)}
.icone:hover,.icone[aria-expanded=true]{background:var(--sup2);color:var(--texto)}
.icone svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.direita{margin-left:auto;display:flex;align-items:center;gap:8px}
select#modelo{appearance:none;background:none;border:0;color:var(--cinza);font-size:13px;padding:6px 20px 6px 8px;border-radius:8px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);
  background-position:calc(100% - 10px) 52%,calc(100% - 6px) 52%;background-size:4px 4px;background-repeat:no-repeat}
select#modelo:hover{background-color:var(--sup2);color:var(--texto)}
select#modelo option{background:var(--sup)}
#gerar{width:32px;height:32px;border-radius:9px;border:0;display:grid;place-items:center;background:var(--acento);color:#fff}
#gerar:disabled{background:var(--sup2);color:var(--fraco);cursor:default}
#gerar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.estado{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:8px;font:11.5px var(--mono);color:var(--fraco);min-height:16px}
.ponto{width:5px;height:5px;border-radius:50%;background:var(--acento);animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{50%{opacity:.25}}
.ancora{position:relative}
.painel{position:absolute;left:0;bottom:42px;z-index:20;width:270px;background:var(--sup2);border:1px solid var(--linha2);border-radius:14px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}
.painel label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--cinza)}
.painel label span{display:flex;justify-content:space-between}
.painel b{font:500 12px var(--mono);color:var(--texto)}
.painel input[type=range]{width:100%;accent-color:var(--acento)}
.painel input[type=text]{background:var(--sup);border:1px solid var(--linha2);border-radius:8px;padding:6px 8px;font:12px var(--mono)}
.painel .nota{margin:0}

.caixa{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.caixa .dentro{width:min(92vw,540px);display:flex;flex-direction:column;gap:10px}
.caixa canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:14px;background:#000}
.caixa p{margin:0 2px;color:var(--cinza);font-size:14px}
@media (prefers-reduced-motion:reduce){.trab,.ponto{animation:none}}
</style>
</head>
<body>
<div class="marca"><a href="https://github.com/Samuelpedroso-dev/minit2i" target="_blank" rel="noopener">MiniT2I</a></div>

<main class="col">
  <div class="vazio-feed" id="vazio-feed"><h1>O que vamos criar?</h1></div>
  <div class="feed" id="feed"></div>
  <div id="galeria"></div>
</main>

<div class="comando"><div class="col">
  <form class="caixa-prompt" id="form">
    <textarea id="prompt" rows="1" placeholder="Descreva uma imagem" disabled></textarea>
    <div class="linha-bar">
      <span class="ancora">
        <button type="button" class="icone" id="bt-ajustes" aria-expanded="false" title="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
        <div class="painel" id="painel" hidden>
          <label><span>Passos <b id="passos-v">30</b></span><input type="range" id="passos" min="8" max="50" value="30"></label>
          <label><span>Guidance <b id="guidance-v">4</b></span><input type="range" id="guidance" min="1" max="8" step="0.5" value="4"></label>
          <label><span>Semente</span><input type="text" id="semente" placeholder="aleatória" inputmode="numeric"></label>
          <p class="nota" id="nucleos"></p>
        </div>
      </span>
      <button type="button" class="icone" id="surpresa" title="Prompt aleatório"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></button>
      <div class="direita">
        <select id="modelo" title="Modelo"><option value="geral" disabled>MiniT2I Geral</option><option value="formas">MiniT2I Formas</option></select>
        <button type="submit" id="gerar" disabled title="Gerar"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
  </form>
  <div class="estado" id="estado"><span class="ponto"></span><span id="estado-txt">carregando</span></div>
</div></div>

<div hidden>
  <button id="aba-formas"></button><button id="aba-geral" disabled></button><button id="aba-gerar"></button><button id="aba-galeria"></button>
  <a data-foco href="#"></a><div id="vocab"></div><div id="sugestoes"></div><div id="sessoes"></div><div id="miniatura"></div>
</div>

<div class="caixa" id="caixa" hidden><div class="dentro">
  <canvas id="grande" width="32" height="32"></canvas>
  <p id="caixa-txt"></p>
  <div class="botoes">
    <button class="bt cheio" id="baixar">Baixar</button>
    <button class="bt" id="variar">Variações</button>
    <button class="bt" id="fechar">Fechar</button>
  </div>
</div></div>

<script type="text/plain" id="fonte-trabalhador">// Motor de inferencia do MiniT2I em JavaScript puro. Mesmo calculo do treino/dit.py,
// conferido contra o PyTorch pelo caso de referencia do modelo.json.

function decodificarF16(b64) {
  const bin = atob(b64.trim());
  const n = bin.length >> 1;
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const h = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
    const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;
    out[i] = e === 0 ? s * f * 5.960464477539063e-8 : e === 31 ? (f ? NaN : s * Infinity) : s * Math.pow(2, e - 15) * (1 + f / 1024);
  }
  return out;
}

function erf(x) {
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}
const geluErf = (x) => 0.5 * x * (1 + erf(x / Math.SQRT2));
const geluTanh = (x) => 0.5 * x * (1 + Math.tanh(0.7978845608028654 * (x + 0.044715 * x * x * x)));
const silu = (x) => x / (1 + Math.exp(-x));

// out[i,o] = sum_k x[i,k] W[o,k] + b[o]
function linear(x, n, din, W, b, dout, wOfs = 0, bOfs = 0) {
  const out = new Float32Array(n * dout);
  for (let i = 0; i < n; i++) {
    const xi = i * din;
    for (let o = 0; o < dout; o++) {
      const wo = wOfs + o * din;
      let s = b ? b[bOfs + o] : 0;
      for (let k = 0; k < din; k++) s += x[xi + k] * W[wo + k];
      out[i * dout + o] = s;
    }
  }
  return out;
}

function layerNorm(x, n, d, eps, g, b) {
  const out = new Float32Array(n * d);
  for (let i = 0; i < n; i++) {
    let m = 0, v = 0;
    for (let k = 0; k < d; k++) m += x[i * d + k];
    m /= d;
    for (let k = 0; k < d; k++) { const z = x[i * d + k] - m; v += z * z; }
    const r = 1 / Math.sqrt(v / d + eps);
    for (let k = 0; k < d; k++) {
      const z = (x[i * d + k] - m) * r;
      out[i * d + k] = g ? z * g[k] + b[k] : z;
    }
  }
  return out;
}

// nn.MultiheadAttention, consulta xq (nq,d), chave e valor xk (nk,d), mask[j] true ignora a chave j
function atencao(xq, nq, xk, nk, d, H, P, mask) {
  const W = P.in_proj_weight, B = P.in_proj_bias;
  const Q = linear(xq, nq, d, W, B, d, 0, 0);
  const K = linear(xk, nk, d, W, B, d, d * d, d);
  const V = linear(xk, nk, d, W, B, d, 2 * d * d, 2 * d);
  const hd = d / H, esc = 1 / Math.sqrt(hd);
  const O = new Float32Array(nq * d), sc = new Float32Array(nk);
  for (let h = 0; h < H; h++) {
    const ho = h * hd;
    for (let i = 0; i < nq; i++) {
      let mx = -Infinity;
      for (let j = 0; j < nk; j++) {
        if (mask && mask[j]) { sc[j] = -Infinity; continue; }
        let s = 0;
        for (let k = 0; k < hd; k++) s += Q[i * d + ho + k] * K[j * d + ho + k];
        sc[j] = s * esc; if (sc[j] > mx) mx = sc[j];
      }
      let soma = 0;
      for (let j = 0; j < nk; j++) { sc[j] = sc[j] === -Infinity ? 0 : Math.exp(sc[j] - mx); soma += sc[j]; }
      for (let j = 0; j < nk; j++) {
        const p = sc[j] / soma; if (!p) continue;
        for (let k = 0; k < hd; k++) O[i * d + ho + k] += p * V[j * d + ho + k];
      }
    }
  }
  return linear(O, nq, d, P.out_proj_weight, P.out_proj_bias, d);
}

class MiniT2I {
  constructor(cfg, pesos) {
    this.cfg = cfg;
    this.w = {};
    for (const t of cfg.tensores) this.w[t.nome] = pesos.subarray(t.ofs, t.ofs + t.n);
    this.stoi = Object.fromEntries(cfg.vocab.map((p, i) => [p, i]));
    const tira = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
    this.semAcento = Object.fromEntries(cfg.vocab.map((p, i) => [tira(p), i]));
    this.tira = tira;
  }
  att(prefixo) {
    const w = this.w;
    return { in_proj_weight: w[prefixo + ".in_proj_weight"], in_proj_bias: w[prefixo + ".in_proj_bias"],
             out_proj_weight: w[prefixo + ".out_proj.weight"], out_proj_bias: w[prefixo + ".out_proj.bias"] };
  }

  // devolve os tokens e as palavras que o modelo nao conhece
  tokenizar(texto) {
    const L = this.cfg.maxlen, tok = new Int32Array(L), ignoradas = [];
    let n = 0;
    for (const p of texto.toLowerCase().split(/\s+/).filter(Boolean)) {
      const id = this.stoi[p] ?? this.semAcento[this.tira(p)];
      if (id === undefined || id < 2) { ignoradas.push(p); continue; }
      if (n < L) tok[n++] = id;
    }
    if (n === 0) tok[0] = 1;
    return { tok, ignoradas };
  }

  codificarTexto(tok) {
    const { dim: d, heads: H, txt_depth, maxlen: L } = this.cfg, w = this.w;
    const mask = Array.from(tok, (t) => t === 0);
    let x = new Float32Array(L * d);
    for (let i = 0; i < L; i++)
      for (let k = 0; k < d; k++) x[i * d + k] = w["text.emb.weight"][tok[i] * d + k] + w["text.pos"][i * d + k];
    for (let l = 0; l < txt_depth; l++) {
      const p = `text.enc.layers.${l}.`;
      let h = layerNorm(x, L, d, 1e-5, w[p + "norm1.weight"], w[p + "norm1.bias"]);
      h = atencao(h, L, h, L, d, H, this.att(p + "self_attn"), mask);
      for (let i = 0; i < x.length; i++) x[i] += h[i];
      h = layerNorm(x, L, d, 1e-5, w[p + "norm2.weight"], w[p + "norm2.bias"]);
      h = linear(h, L, d, w[p + "linear1.weight"], w[p + "linear1.bias"], 4 * d);
      for (let i = 0; i < h.length; i++) h[i] = geluErf(h[i]);
      h = linear(h, L, 4 * d, w[p + "linear2.weight"], w[p + "linear2.bias"], d);
      for (let i = 0; i < x.length; i++) x[i] += h[i];
    }
    x = layerNorm(x, L, d, 1e-5, w["text.norm.weight"], w["text.norm.bias"]);
    const pooled = new Float32Array(d); let n = 0;
    for (let i = 0; i < L; i++) if (!mask[i]) { n++; for (let k = 0; k < d; k++) pooled[k] += x[i * d + k]; }
    for (let k = 0; k < d; k++) pooled[k] /= n;
    return { txt: x, mask, pooled };
  }

  // x em (3, img, img), t escalar em [0,1], ctx de codificarTexto. Devolve a velocidade prevista.
  forward(x, t, ctx) {
    const { img, ch: C, patch: p, dim: d, depth, heads: H, maxlen: L } = this.cfg, w = this.w;
    const g = img / p, N = g * g, half = d / 2;
    // embedding do tempo
    const te = new Float32Array(d);
    for (let k = 0; k < half; k++) {
      const a = t * 1000 * Math.exp(-Math.log(10000) * k / half);
      te[k] = Math.cos(a); te[half + k] = Math.sin(a);
    }
    let c = linear(te, 1, d, w["t_mlp.0.weight"], w["t_mlp.0.bias"], d).map(silu);
    c = linear(c, 1, d, w["t_mlp.2.weight"], w["t_mlp.2.bias"], d);
    for (let k = 0; k < d; k++) c[k] += ctx.pooled[k];
    const cs = c.map(silu);
    // patches
    const pv = new Float32Array(N * C * p * p);
    for (let i = 0; i < g; i++) for (let j = 0; j < g; j++) {
      const base = (i * g + j) * C * p * p;
      for (let cc = 0; cc < C; cc++) for (let a = 0; a < p; a++) for (let b = 0; b < p; b++)
        pv[base + cc * p * p + a * p + b] = x[cc * img * img + (i * p + a) * img + j * p + b];
    }
    let h = linear(pv, N, C * p * p, w["embed.weight"], w["embed.bias"], d);
    for (let i = 0; i < h.length; i++) h[i] += w["pos"][i];
    for (let l = 0; l < depth; l++) {
      const pr = `blocks.${l}.`;
      const m = linear(cs, 1, d, w[pr + "ada.1.weight"], w[pr + "ada.1.bias"], 6 * d);
      let u = layerNorm(h, N, d, 1e-6);
      for (let i = 0; i < N; i++) for (let k = 0; k < d; k++) u[i * d + k] = u[i * d + k] * (1 + m[d + k]) + m[k];
      u = atencao(u, N, u, N, d, H, this.att(pr + "attn"), null);
      for (let i = 0; i < N; i++) for (let k = 0; k < d; k++) h[i * d + k] += m[2 * d + k] * u[i * d + k];
      u = layerNorm(h, N, d, 1e-5, w[pr + "n2.weight"], w[pr + "n2.bias"]);
      u = atencao(u, N, ctx.txt, L, d, H, this.att(pr + "cross"), ctx.mask);
      for (let i = 0; i < h.length; i++) h[i] += u[i];
      u = layerNorm(h, N, d, 1e-6);
      for (let i = 0; i < N; i++) for (let k = 0; k < d; k++) u[i * d + k] = u[i * d + k] * (1 + m[4 * d + k]) + m[3 * d + k];
      u = linear(u, N, d, w[pr + "mlp.0.weight"], w[pr + "mlp.0.bias"], 4 * d);
      for (let i = 0; i < u.length; i++) u[i] = geluTanh(u[i]);
      u = linear(u, N, 4 * d, w[pr + "mlp.2.weight"], w[pr + "mlp.2.bias"], d);
      for (let i = 0; i < N; i++) for (let k = 0; k < d; k++) h[i * d + k] += m[5 * d + k] * u[i * d + k];
    }
    const f = linear(cs, 1, d, w["fada.1.weight"], w["fada.1.bias"], 2 * d);
    let u = layerNorm(h, N, d, 1e-6);
    for (let i = 0; i < N; i++) for (let k = 0; k < d; k++) u[i * d + k] = u[i * d + k] * (1 + f[d + k]) + f[k];
    u = linear(u, N, d, w["out.weight"], w["out.bias"], p * p * C);
    const v = new Float32Array(C * img * img);
    for (let i = 0; i < g; i++) for (let j = 0; j < g; j++) for (let a = 0; a < p; a++) for (let b = 0; b < p; b++)
      for (let cc = 0; cc < C; cc++)
        v[cc * img * img + (i * p + a) * img + j * p + b] = u[(i * g + j) * p * p * C + (a * p + b) * C + cc];
    return v;
  }
}

// gerador pseudoaleatorio com semente, ruido normal por Box Muller
function ruido(n, semente) {
  let s = semente >>> 0 || 1;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return (s + 0.5) / 4294967296; };
  const out = new Float32Array(n);
  for (let i = 0; i < n; i += 2) {
    const u = r(), v = r(), m = Math.sqrt(-2 * Math.log(u));
    out[i] = m * Math.cos(2 * Math.PI * v); if (i + 1 < n) out[i + 1] = m * Math.sin(2 * Math.PI * v);
  }
  return out;
}

// Web Worker, gera uma imagem por vez. Recebe os pesos uma vez e depois pedidos de geracao.
// montar.py junta este arquivo ao motor.js num unico script.

let modelo = null;

function paraRGBA(x, S) {
  const out = new Uint8ClampedArray(S * S * 4);
  for (let i = 0; i < S * S; i++) {
    for (let c = 0; c < 3; c++) out[i * 4 + c] = Math.round((Math.max(-1, Math.min(1, x[c * S * S + i])) + 1) * 127.5);
    out[i * 4 + 3] = 255;
  }
  return out;
}

self.onmessage = (e) => {
  const d = e.data;
  if (d.tipo === "iniciar") {
    modelo = new MiniT2I(d.cfg, d.pesos);
    self.postMessage({ tipo: "pronto" });
    return;
  }
  if (d.tipo !== "gerar") return;
  const S = modelo.cfg.img, n = 3 * S * S;
  const cond = modelo.codificarTexto(Int32Array.from(d.tok));
  const vazio = new Int32Array(modelo.cfg.maxlen); vazio[0] = 1;
  const inc = modelo.codificarTexto(vazio);
  const z = ruido(n, d.semente);
  // geracao do zero comeca em t = 1. Variacao parte de uma imagem pronta misturada com ruido.
  const t0 = d.base ? d.forca : 1;
  let x = new Float32Array(n);
  if (d.base) {
    for (let i = 0; i < S * S; i++) for (let c = 0; c < 3; c++) x[c * S * S + i] = d.base[i * 4 + c] / 127.5 - 1;
    for (let k = 0; k < n; k++) x[k] = (1 - t0) * x[k] + t0 * z[k];
  } else x = z;
  const passos = Math.max(1, Math.round(d.passos * t0));
  const inicio = performance.now();
  for (let i = 0; i < passos; i++) {
    const t = t0 * (1 - i / passos), t2 = t0 * (1 - (i + 1) / passos);
    const vc = modelo.forward(x, t, cond);
    const vu = d.guidance === 1 ? vc : modelo.forward(x, t, inc);
    const prev = new Float32Array(n);
    for (let k = 0; k < n; k++) {
      const v = vu[k] + d.guidance * (vc[k] - vu[k]);
      prev[k] = x[k] - t * v;
      x[k] += (t2 - t) * v;
    }
    const fim = i === passos - 1;
    self.postMessage({ tipo: "passo", id: d.id, idx: d.idx, passo: i + 1, total: passos,
                       rgba: paraRGBA(fim ? x : prev, S), fim, ms: performance.now() - inicio });
  }
};

<script>// Motor do MiniT2I geral no navegador. Baixa os tres modelos ONNX do Hugging Face,
// guarda no cache do navegador e gera com o ONNX Runtime Web, na placa de video por WebGPU.
const MiniGeral = (() => {
  const ORT = window.MINIT2I_ORT || "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/";
  let ort = null, sess = {}, meta = null, vocab = null, pronto = false, base = "";

  function carregarScript(src) {
    return new Promise((ok, erro) => {
      const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => erro(new Error("falha ao carregar " + src));
      document.head.appendChild(s);
    });
  }

  // quando ja existe uma versao antiga no cache, usa ela na hora e baixa a nova em segundo plano para a proxima visita
  async function baixar(url, versao, aoProgresso, aceitarAntiga, aoUsarAntiga) {
    const chave = url + "?v=" + encodeURIComponent(versao);
    let cache = null;
    try {
      cache = await caches.open("minit2i-geral");
      const hit = await cache.match(chave);
      if (hit) { const b = await hit.arrayBuffer(); aoProgresso(b.byteLength, b.byteLength); return b; }
      if (aceitarAntiga) {
        for (const k of await cache.keys()) {
          if (!k.url.startsWith(url + "?v=")) continue;
          const velho = await cache.match(k); if (!velho) continue;
          const b = await velho.arrayBuffer(); aoProgresso(b.byteLength, b.byteLength);
          if (aoUsarAntiga) aoUsarAntiga(decodeURIComponent(k.url.split("?v=")[1] || ""));
          baixar(url, versao, () => {}, false).catch(() => {});
          return b;
        }
      }
    } catch (e) { cache = null; }
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${r.status} ao baixar ${url.split("/").pop()}`);
    const total = +r.headers.get("content-length") || 0;
    const leitor = r.body.getReader(); const partes = []; let n = 0;
    for (;;) { const { done, value } = await leitor.read(); if (done) break; partes.push(value); n += value.length; aoProgresso(n, total); }
    const buf = new Uint8Array(n); let o = 0; for (const p of partes) { buf.set(p, o); o += p.length; }
    try { if (cache) { await cache.put(chave, new Response(buf)); for (const k of await cache.keys()) if (k.url.startsWith(url) && k.url !== new Request(chave).url) await cache.delete(k); } } catch (e) { /* sem cache, segue */ }
    return buf.buffer;
  }

  // tokenizador BERT multilingue, mesmo algoritmo do original: limpeza, separacao de CJK e pontuacao, WordPiece
  function ehPont(cp) {
    if ((cp >= 33 && cp <= 47) || (cp >= 58 && cp <= 64) || (cp >= 91 && cp <= 96) || (cp >= 123 && cp <= 126)) return true;
    return /\p{P}/u.test(String.fromCodePoint(cp));
  }
  function ehCJK(cp) {
    return (cp >= 0x4E00 && cp <= 0x9FFF) || (cp >= 0x3400 && cp <= 0x4DBF) || (cp >= 0x20000 && cp <= 0x2A6DF) || (cp >= 0x2A700 && cp <= 0x2B73F) ||
      (cp >= 0x2B740 && cp <= 0x2B81F) || (cp >= 0x2B820 && cp <= 0x2CEAF) || (cp >= 0xF900 && cp <= 0xFAFF) || (cp >= 0x2F800 && cp <= 0x2FA1F);
  }
  function ehEspaco(ch) { return ch === " " || ch === "\t" || ch === "\n" || ch === "\r" || /\p{Zs}/u.test(ch); }
  function ehControle(ch) { if (ch === "\t" || ch === "\n" || ch === "\r") return false; return /[\p{Cc}\p{Cf}]/u.test(ch); }

  function palavrasBasicas(texto, minusculas) {
    let limpo = "";
    for (const ch of texto) {
      const cp = ch.codePointAt(0);
      if (cp === 0 || cp === 0xFFFD || ehControle(ch)) continue;
      if (ehEspaco(ch)) limpo += " ";
      else if (ehCJK(cp)) limpo += " " + ch + " ";
      else limpo += ch;
    }
    const out = [];
    for (let tok of limpo.trim().split(/ +/).filter(Boolean)) {
      if (minusculas) tok = tok.toLowerCase().normalize("NFD").replace(/\p{Mn}/gu, "");
      let atual = "";
      for (const ch of tok) {
        if (ehPont(ch.codePointAt(0))) { if (atual) out.push(atual); out.push(ch); atual = ""; } else atual += ch;
      }
      if (atual) out.push(atual);
    }
    return out;
  }

  function wordpiece(palavra) {
    const chars = Array.from(palavra);
    if (chars.length > 100) return [meta.tokenizador.unk];
    const ids = []; let ini = 0;
    while (ini < chars.length) {
      let fim = chars.length, achou = -1;
      while (ini < fim) {
        let sub = chars.slice(ini, fim).join(""); if (ini > 0) sub = "##" + sub;
        const id = vocab.get(sub);
        if (id !== undefined) { achou = id; break; }
        fim--;
      }
      if (achou < 0) return [meta.tokenizador.unk];
      ids.push(achou); ini = fim;
    }
    return ids;
  }

  function tokenizar(texto) {
    const tk = meta.tokenizador, L = meta.maxlen;
    let ids = [tk.cls];
    for (const p of palavrasBasicas(texto, tk.minusculas)) ids.push(...wordpiece(p));
    ids = ids.slice(0, L - 1); ids.push(tk.sep);
    const out = new BigInt64Array(L), am = new BigInt64Array(L);
    ids.forEach((v, i) => { out[i] = BigInt(v); am[i] = 1n; });
    for (let i = ids.length; i < L; i++) out[i] = BigInt(tk.pad);
    return { ids: out, am, n: ids.length };
  }

  async function iniciar(repo, aoEstado) {
    if (pronto) return meta;
    base = /^(https?:|\/)/.test(repo) ? repo : `https://huggingface.co/${repo}/resolve/main/web/`;
    aoEstado("carregando o ONNX Runtime");
    if (!window.ort) await carregarScript(ORT + "ort.webgpu.min.js");
    ort = window.ort; ort.env.wasm.wasmPaths = ORT;
    meta = await (await fetch(base + "meta.json?t=" + Date.now(), { cache: "no-store" })).json();
    const gpu = !!navigator.gpu && !!(await navigator.gpu.requestAdapter().catch(() => null));
    if (!gpu && meta.dtype === "fp16") throw new Error("o modelo geral precisa de WebGPU. Use o Chrome ou o Edge atualizados num computador.");
    const arquivos = [["texto.onnx", "texto"], ["dit.onnx", "dit"], ["vae.onnx", "vae"]];
    const tam = meta.tamanhos || {}; const totalMB = Object.values(tam).reduce((a, b) => a + b, 0) / 1e6;
    const feito = {};
    const prog = (nome) => (n, t) => { feito[nome] = n; const mb = Object.values(feito).reduce((a, b) => a + b, 0) / 1e6;
      aoEstado(`baixando o modelo geral, ${Math.round(mb)} de ${Math.round(totalMB || mb)} MB, só na primeira vez`); };
    const [vtxt, ...bufs] = await Promise.all([
      fetch(base + "vocab.txt?v=" + meta.tokenizador_versao).then((r) => r.text()),
      ...arquivos.map(([f]) => f === "dit.onnx"
        ? baixar(base + f, meta.versao, prog(f), true, (v) => { if (/^\d+$/.test(v)) meta.passo = +v; })
        : baixar(base + f, "fixo", prog(f))),
    ]);
    vocab = new Map(vtxt.split("\n").map((w, i) => [w, i]));
    aoEstado("preparando a rede na placa de vídeo");
    const ep = gpu ? ["webgpu", "wasm"] : ["wasm"];
    sess.texto = await ort.InferenceSession.create(bufs[0], { executionProviders: ["wasm"] });
    sess.dit = await ort.InferenceSession.create(bufs[1], { executionProviders: ep });
    sess.vae = await ort.InferenceSession.create(bufs[2], { executionProviders: ep });
    pronto = true;
    return meta;
  }

  async function codificar(textos) {
    const L = meta.maxlen, D = meta.cfg.txt_dim, n = textos.length;
    const ids = new BigInt64Array(n * L), am = new BigInt64Array(n * L), mask = new Uint8Array(n * L), palavras = [];
    textos.forEach((t, i) => { const r = tokenizar(t); ids.set(r.ids, i * L); am.set(r.am, i * L); for (let j = 0; j < L; j++) mask[i * L + j] = r.am[j] === 0n ? 1 : 0; });
    const o = await sess.texto.run({ ids: new ort.Tensor("int64", ids, [n, L]), am: new ort.Tensor("int64", am, [n, L]) });
    return { h: o.h.data, pooled: o.pooled.data, mask, L, D };
  }

  function ruido(n, semente) {
    let s = (semente >>> 0) || 1;
    const r = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return (s + 0.5) / 4294967296; };
    const out = new Float32Array(n);
    for (let i = 0; i < n; i += 2) { const u = r(), v = r(), m = Math.sqrt(-2 * Math.log(u)); out[i] = m * Math.cos(2 * Math.PI * v); if (i + 1 < n) out[i + 1] = m * Math.sin(2 * Math.PI * v); }
    return out;
  }

  async function decodificar(z, n) {
    const c = meta.cfg; const o = await sess.vae.run({ z: new ort.Tensor("float32", z, [n, c.lat_ch, c.lat_res, c.lat_res]) });
    const img = o.img.data, S = o.img.dims[2], imgs = [];
    for (let b = 0; b < n; b++) {
      const rgba = new Uint8ClampedArray(S * S * 4);
      for (let i = 0; i < S * S; i++) { for (let k = 0; k < 3; k++) rgba[i * 4 + k] = (img[((b * 3 + k) * S * S) + i] + 1) * 127.5; rgba[i * 4 + 3] = 255; }
      imgs.push(rgba);
    }
    return { imgs, S };
  }

  // gera n imagens ao mesmo tempo, com previa periodica da estimativa da imagem final
  async function gerar(prompt, { n = 4, passos = 25, cfg = 4.5, semente = 0 }, aoPasso) {
    const c = meta.cfg, Z = c.lat_ch * c.lat_res * c.lat_res;
    const enc = await codificar([prompt, ""]);
    const { L, D } = enc, B = 2 * n;
    const txt = new Float32Array(B * L * D), pooled = new Float32Array(B * D), tmask = new Uint8Array(B * L);
    for (let b = 0; b < B; b++) {
      const src = b < n ? 0 : 1;
      txt.set(enc.h.subarray(src * L * D, (src + 1) * L * D), b * L * D);
      pooled.set(enc.pooled.subarray(src * D, (src + 1) * D), b * D);
      tmask.set(enc.mask.subarray(src * L, (src + 1) * L), b * L);
    }
    const tTxt = new ort.Tensor("float32", txt, [B, L, D]), tPool = new ort.Tensor("float32", pooled, [B, D]), tMask = new ort.Tensor("bool", tmask, [B, L]);
    let x = new Float32Array(n * Z);
    for (let b = 0; b < n; b++) x.set(ruido(Z, semente + b * 7919), b * Z);
    const cada = Math.max(1, Math.round(passos / 6));
    for (let i = 0; i < passos; i++) {
      const t = 1 - i / passos, t2 = 1 - (i + 1) / passos;
      const xx = new Float32Array(B * Z); xx.set(x); xx.set(x, n * Z);
      const o = await sess.dit.run({ x: new ort.Tensor("float32", xx, [B, c.lat_ch, c.lat_res, c.lat_res]), t: new ort.Tensor("float32", new Float32Array(B).fill(t), [B]), txt: tTxt, tmask: tMask, pooled: tPool });
      const v = o.v.data, prev = new Float32Array(n * Z);
      for (let k = 0; k < n * Z; k++) { const vv = v[n * Z + k] + cfg * (v[k] - v[n * Z + k]); prev[k] = x[k] - t * vv; x[k] += (t2 - t) * vv; }
      const fim = i === passos - 1;
      if (fim || (i + 1) % cada === 0) { const d = await decodificar(fim ? x : prev, n); await aoPasso(i + 1, passos, d.imgs, d.S, fim); }
      else await aoPasso(i + 1, passos, null, 0, false);
    }
  }

  return { iniciar, gerar, tokenizar: (t) => tokenizar(t), get meta() { return meta; }, get pronto() { return pronto; }, _palavras: palavrasBasicas };
})();
</script>
<script>// Interface. Carrega os pesos, distribui as imagens entre os nucleos e monta o feed de trabalhos.
(() => {
  const $ = (id) => document.getElementById(id);
  const NUC = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2)));
  const CHAVE = "minit2i.historico.v1";
  let cfg = null, tokenizador = null, trabalhadores = [], livres = [], fila = [], trabalhos = new Map(), contador = 0;

  // tokenizacao igual a do motor, repetida aqui para mostrar as palavras ignoradas antes de gerar
  const tira = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
  function tokenizar(texto) {
    const L = cfg.maxlen, tok = new Array(L).fill(0), palavras = [];
    let n = 0;
    for (const p of texto.toLowerCase().split(/\s+/).filter(Boolean)) {
      const id = tokenizador.stoi[p] ?? tokenizador.sem[tira(p)];
      const ok = id !== undefined && id >= 2 && n < L;
      if (ok) tok[n++] = id;
      palavras.push({ p, ok });
    }
    if (n === 0) tok[0] = 1;
    return { tok, palavras };
  }

  function estado(txt, pulsando = true) {
    $("estado-txt").textContent = txt;
    $("estado").querySelector(".ponto").style.visibility = pulsando ? "visible" : "hidden";
  }

  // vocabulario em grupos, cada palavra vira um botao que entra no prompt
  function montarVocab() {
    const nomes = { formas: "formas", cores: "cores", tamanhos: "tamanhos", posicoes: "posições" };
    $("vocab").innerHTML = "";
    for (const [k, lista] of Object.entries(cfg.grupos)) {
      const div = document.createElement("div");
      div.innerHTML = `<span class="olho">${nomes[k] || k}</span><div class="chips"></div>`;
      for (const w of lista) {
        const b = document.createElement("button");
        b.className = "chip"; b.type = "button"; b.textContent = w;
        b.onclick = () => { const i = $("prompt"); i.value = (i.value.trim() + " " + w).trim(); i.focus(); };
        div.querySelector(".chips").appendChild(b);
      }
      $("vocab").appendChild(div);
    }
  }

  function montarSugestoes() {
    const exemplos = modo === "geral" ? SUG_GERAL : [["um triângulo azul grande no centro", "Nunca visto"], ["um losango roxo pequeno no topo", "Novo"],
                      ["um círculo laranja grande à direita", "Popular"]];
    const box = $("sugestoes"); box.innerHTML = "";
    for (const [p, selo] of exemplos) {
      const b = document.createElement("button"); b.type = "button"; b.className = "sug";
      b.innerHTML = `<span class="t">/ ${esc(p)}</span><span class="selo${selo === "Popular" ? " quente" : ""}">${selo}</span>`;
      b.onclick = () => { $("prompt").value = p; $("prompt").focus(); };
      box.appendChild(b);
    }
    const mais = document.createElement("button"); mais.type = "button"; mais.className = "sug";
    mais.innerHTML = `<span class="t">Mais palavras</span><span aria-hidden="true">›</span>`;
    mais.onclick = () => { $("vocab").hidden = !$("vocab").hidden; };
    if (modo !== "geral") box.appendChild(mais);
  }

  function lembrarSessao(prompt) {
    const box = $("sessoes"); box.querySelector(".vazio-s")?.remove();
    const b = document.createElement("button"); b.type = "button"; b.textContent = prompt; b.title = prompt;
    b.onclick = () => { $("prompt").value = prompt; $("prompt").focus(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    box.prepend(b);
    while (box.children.length > 14) box.lastChild.remove();
  }

  function surpresa() {
    if (modo === "geral") return SURPRESA_GERAL[Math.floor(Math.random() * SURPRESA_GERAL.length)];
    const g = cfg.grupos, r = (a) => a[Math.floor(Math.random() * a.length)];
    return `um ${r(g.formas)} ${r(g.cores)} ${r(g.tamanhos)} ${r(g.posicoes)}`;
  }

  // fila de imagens, cada trabalhador pega a proxima quando fica livre
  function despachar() {
    while (livres.length && fila.length) {
      const w = livres.pop(), job = fila.shift();
      w.ocupado = job; w.postMessage(job.msg);
    }
  }

  function aoMensagem(w, e) {
    const d = e.data;
    if (d.tipo === "pronto") { livres.push(w); despachar(); return; }
    if (d.tipo !== "passo") return;
    const t = trabalhos.get(d.id); if (!t) return;
    const cel = t.cels[d.idx];
    cel.ctx.putImageData(new ImageData(d.rgba, cfg.img, cfg.img), 0, 0);
    cel.pct.textContent = d.fim ? "" : Math.round(100 * d.passo / d.total) + "%";
    t.prog[d.idx] = d.passo / d.total;
    t.barra.style.width = (100 * t.prog.reduce((a, b) => a + b, 0) / 4) + "%";
    if (d.fim) {
      cel.el.classList.remove("gerando"); cel.pronta = true;
      w.ocupado = null; livres.push(w); despachar();
      if (t.cels.every((c) => c.pronta)) concluir(t);
    }
  }

  function concluir(t) {
    const s = ((performance.now() - t.inicio) / 1000).toFixed(1).replace(".", ",");
    t.tempo.textContent = `pronto em ${s} s`;
    t.barra.parentElement.hidden = true;
    t.botoes.forEach((b) => (b.disabled = false));
    const m = $("miniatura"); m.textContent = "";
    const c = document.createElement("canvas"); c.width = c.height = t.S;
    c.getContext("2d").drawImage(t.cels[0].canvas, 0, 0); m.appendChild(c);
    salvarHistorico();
  }

  function criarCartao(dados) {
    $("vazio-feed").hidden = true;
    const el = document.createElement("article");
    el.className = "trab";
    const promptHTML = dados.palavras.map(({ p, ok }) => ok ? esc(p) : `<span class="ign" title="palavra que o modelo ainda não conhece">${esc(p)}</span>`).join(" ");
    const ign = 0;
    el.innerHTML = `
      <div class="bolha">${promptHTML || "<span class='ign'>prompt vazio</span>"}</div>
      <div class="resposta">
      <div class="grade"></div>
      <div class="info">
        <div class="meta num"><span>${dados.tipo}</span><span>semente ${dados.sementes[0]}</span><span>${dados.passos} passos</span><span>guidance ${String(dados.guidance).replace(".", ",")}</span><span class="tempo">na fila</span></div>
        ${ign ? `<div class="nota">As palavras riscadas ainda não fazem parte do vocabulário e foram ignoradas.</div>` : ""}
        <div class="barra"><i style="width:0"></i></div>
        <div class="botoes">
          <button class="bt" data-a="refazer" disabled>Refazer</button>
          <button class="bt" data-a="editar" disabled>Editar</button>
        </div>
      </div>
      </div>`;
    const grade = el.querySelector(".grade");
    const S = dados.tam || cfg.img;
    const t = { id: ++contador, el, dados, S, cels: [], prog: [0, 0, 0, 0], inicio: performance.now(),
                barra: el.querySelector(".barra i"), tempo: el.querySelector(".tempo"), botoes: [...el.querySelectorAll(".botoes .bt")] };
    for (let i = 0; i < 4; i++) {
      const c = document.createElement("div"); c.className = "cel gerando";
      c.innerHTML = `<canvas width="${S}" height="${S}"${dados.modelo === "geral" ? ' style="image-rendering:auto"' : ""}></canvas><span class="pct"></span>`;
      const cv = c.querySelector("canvas");
      const cel = { el: c, ctx: cv.getContext("2d"), canvas: cv, pct: c.querySelector(".pct"), pronta: false };
      c.onclick = () => cel.pronta && abrir(t, i);
      t.cels.push(cel); grade.appendChild(c);
    }
    el.querySelector('[data-a="refazer"]').onclick = () => dados.modelo === "geral" ? novoTrabalhoGeral(dados.prompt) : novoTrabalho(dados.prompt);
    el.querySelector('[data-a="editar"]').onclick = () => { $("prompt").value = dados.prompt; $("prompt").focus(); };
    $("feed").append(el);
    trabalhos.set(t.id, t);
    lembrarSessao(dados.prompt);
    return t;
  }

  function lerAjustes() {
    const s = parseInt($("semente").value, 10);
    return { passos: +$("passos").value, guidance: +$("guidance").value, semente: Number.isFinite(s) ? s : Math.floor(Math.random() * 1e9) };
  }

  function novoTrabalho(prompt, base = null) {
    const { tok, palavras } = tokenizar(prompt);
    const a = lerAjustes();
    const sementes = [0, 1, 2, 3].map((k) => a.semente + k * 7919);
    const t = criarCartao({ prompt, palavras, sementes, passos: a.passos, guidance: a.guidance, tipo: base ? "variação" : "geração" });
    t.tempo.textContent = "gerando";
    t.cels.forEach((cel, i) => {
      if (base) cel.ctx.putImageData(new ImageData(new Uint8ClampedArray(base), cfg.img, cfg.img), 0, 0);
      fila.push({ msg: { tipo: "gerar", id: t.id, idx: i, tok, semente: sementes[i], passos: a.passos, guidance: a.guidance,
                         base: base ? new Uint8ClampedArray(base) : null, forca: 0.6 } });
    });
    despachar();
  }

  // modelo geral, roda na placa de video, um trabalho por vez
  let filaGeral = Promise.resolve(), modo = "formas";
  async function garantirGeral() {
    if (MiniGeral.pronto) return;
    const m = await MiniGeral.iniciar(GERAL_REPO, (txt) => estado(txt));
    estado(`passo ${m.passo.toLocaleString("pt-BR")} do treino`, false);
  }
  function novoTrabalhoGeral(prompt) {
    const a = lerAjustes();
    const palavras = prompt.split(/\s+/).filter(Boolean).map((p) => ({ p, ok: true }));
    const t = criarCartao({ prompt, palavras, sementes: [a.semente], passos: a.passos, guidance: a.guidance, tipo: "geral, prévia", modelo: "geral", tam: 128 });
    t.tempo.textContent = "na fila";
    filaGeral = filaGeral.then(async () => {
      try {
        t.tempo.textContent = "carregando o modelo";
        await garantirGeral();
        t.inicio = performance.now(); t.tempo.textContent = "gerando";
        await MiniGeral.gerar(prompt, { n: 4, passos: a.passos, cfg: a.guidance, semente: a.semente }, async (p, total, imgs, S, fim) => {
          t.barra.style.width = (100 * p / total) + "%";
          t.cels.forEach((c) => (c.pct.textContent = fim ? "" : Math.round(100 * p / total) + "%"));
          if (imgs) imgs.forEach((rgba, i) => {
            const c = t.cels[i];
            if (c.canvas.width !== S) { c.canvas.width = c.canvas.height = S; t.S = S; }
            c.ctx.putImageData(new ImageData(rgba, S, S), 0, 0);
          });
          if (fim) { t.cels.forEach((c) => { c.pronta = true; c.el.classList.remove("gerando"); }); concluir(t); }
          await new Promise((r) => setTimeout(r, 0));
        });
      } catch (e) {
        console.error(e);
        t.tempo.textContent = "não foi possível gerar"; t.barra.parentElement.hidden = true;
        t.botoes.forEach((b) => (b.disabled = false));
        estado(e.message || String(e), false);
      }
    });
  }

  const SUG_GERAL = [["um cachorro correndo na grama", "Novo"], ["uma praia com coqueiros ao pôr do sol", "Popular"], ["a plate of pasta with tomato sauce", "Inglês"]];
  const SURPRESA_GERAL = ["uma casa de madeira na floresta", "montanhas cobertas de neve", "um gato dormindo no sofá", "a red car on a city street",
    "um prato de frutas tropicais", "a lighthouse at night", "um campo de flores amarelas", "a bowl of ramen", "uma cidade à noite com luzes", "um barco no lago"];
  function mudarModo(novo) {
    if (novo === "geral" && !GERAL_REPO) return;
    modo = novo;
    $("aba-formas").classList.toggle("on", modo === "formas"); $("aba-geral").classList.toggle("on", modo === "geral");
    $("modelo").value = modo;
    $("prompt").placeholder = modo === "geral" ? "Descreva uma imagem" : "um triângulo azul grande no centro";
    montarSugestoes();
    if (modo === "geral") $("vocab").hidden = true;
  }

  // ampliacao, download e variacoes
  let aberto = null;
  function abrir(t, i) {
    aberto = { t, i };
    const gc = $("grande"); gc.width = gc.height = t.S;
    gc.style.imageRendering = t.dados.modelo === "geral" ? "auto" : "pixelated";
    gc.getContext("2d").putImageData(t.cels[i].ctx.getImageData(0, 0, t.S, t.S), 0, 0);
    $("caixa-txt").textContent = t.dados.prompt;
    $("caixa").hidden = false;
  }
  $("fechar").onclick = () => ($("caixa").hidden = true);
  $("caixa").onclick = (e) => { if (e.target === $("caixa")) $("caixa").hidden = true; };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("caixa").hidden = true; });
  $("baixar").onclick = () => {
    const c = document.createElement("canvas"); c.width = c.height = 512;
    const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
    g.drawImage($("grande"), 0, 0, 512, 512);
    const a = document.createElement("a");
    a.download = "minit2i " + aberto.t.dados.prompt.slice(0, 40) + ".png";
    a.href = c.toDataURL("image/png"); a.click();
  };
  $("variar").onclick = () => {
    const { t, i } = aberto; $("caixa").hidden = true;
    if (t.dados.modelo === "geral") novoTrabalhoGeral(t.dados.prompt);
    else novoTrabalho(t.dados.prompt, t.cels[i].ctx.getImageData(0, 0, cfg.img, cfg.img).data);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  };

  // historico local, so as imagens prontas, como PNG pequeno
  function salvarHistorico() {
    try {
      const itens = [...trabalhos.values()].filter((t) => t.cels.every((c) => c.pronta)).slice(-24).map((t) => ({
        d: t.dados, img: t.cels.map((c) => c.canvas.toDataURL()) }));
      localStorage.setItem(CHAVE, JSON.stringify(itens));
    } catch (e) { /* armazenamento indisponivel, segue sem historico */ }
  }
  function carregarHistorico() {
    let itens = [];
    try { itens = JSON.parse(localStorage.getItem(CHAVE) || "[]"); } catch (e) { return 0; }
    for (const it of itens) {
      const t = criarCartao(it.d);
      it.img.forEach((src, i) => {
        const im = new Image();
        im.onload = () => t.cels[i].ctx.drawImage(im, 0, 0);
        im.src = src; t.cels[i].pronta = true; t.cels[i].el.classList.remove("gerando");
      });
      t.tempo.textContent = "do seu histórico"; t.barra.parentElement.hidden = true;
      t.botoes.forEach((b) => (b.disabled = false));
    }
    return itens.length;
  }

  function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

  $("passos").oninput = () => ($("passos-v").textContent = $("passos").value);
  $("guidance").oninput = () => ($("guidance-v").textContent = $("guidance").value.replace(".", ","));
  $("prompt").addEventListener("input", () => { const p = $("prompt"); p.style.height = "auto"; p.style.height = p.scrollHeight + "px"; });
  $("prompt").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!$("gerar").disabled) $("form").requestSubmit(); }
  });
  $("bt-ajustes").onclick = (e) => {
    e.stopPropagation();
    const ab = $("painel").hidden; $("painel").hidden = !ab; $("bt-ajustes").setAttribute("aria-expanded", String(ab));
  };
  $("painel").onclick = (e) => e.stopPropagation();
  document.addEventListener("click", () => { $("painel").hidden = true; $("bt-ajustes").setAttribute("aria-expanded", "false"); });
  $("aba-galeria").onclick = () => $("galeria").scrollIntoView({ behavior: "smooth" });
  $("aba-gerar").onclick = () => { window.scrollTo({ top: 0, behavior: "smooth" }); $("prompt").focus(); };
  document.querySelector("[data-foco]").onclick = (e) => { e.preventDefault(); $("prompt").focus(); };
  $("aba-formas").onclick = () => mudarModo("formas");
  $("aba-geral").onclick = () => mudarModo("geral");
  $("modelo").onchange = () => mudarModo($("modelo").value);
  if (GERAL_REPO) { $("aba-geral").disabled = false; $("modelo").querySelector('option[value="geral"]').disabled = false; }
  $("surpresa").onclick = () => { $("prompt").value = surpresa(); $("prompt").focus(); };
  $("form").onsubmit = (e) => {
    e.preventDefault();
    const p = $("prompt").value.trim() || surpresa();
    modo === "geral" ? novoTrabalhoGeral(p) : novoTrabalho(p);
    $("prompt").value = ""; $("prompt").style.height = "auto";
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  };

  async function iniciar() {
    try {
      const [rc, rp] = await Promise.all([fetch("modelo.json"), fetch("pesos.b64.txt")]);
      cfg = await rc.json();
      estado("decodificando os pesos");
      const b64 = await rp.text();
      const fonte = document.getElementById("fonte-trabalhador").textContent;
      const url = URL.createObjectURL(new Blob([fonte], { type: "text/javascript" }));
      tokenizador = { stoi: Object.fromEntries(cfg.vocab.map((p, i) => [p, i])), sem: Object.fromEntries(cfg.vocab.map((p, i) => [tira(p), i])) };
      montarVocab(); montarSugestoes();
      // decodifica uma vez aqui e manda uma copia para cada nucleo
      const bin = atob(b64.trim()), u16 = new Uint16Array(bin.length >> 1);
      for (let i = 0; i < u16.length; i++) u16[i] = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
      const pesos = f16ParaF32(u16);
      for (let k = 0; k < NUC; k++) {
        const w = new Worker(url);
        w.onmessage = (e) => aoMensagem(w, e);
        w.postMessage({ tipo: "iniciar", cfg, pesos: pesos.slice() });
        trabalhadores.push(w);
      }
      $("nucleos").textContent = `${NUC} ${NUC > 1 ? "núcleos" : "núcleo"} em uso`;
      $("prompt").disabled = false; $("gerar").disabled = false;
      estado("", false);
      if (GERAL_REPO) mudarModo("geral"); else mudarModo("formas");
      carregarHistorico();
      window.scrollTo({ top: document.body.scrollHeight });
    } catch (e) {
      estado("não foi possível carregar o modelo. Abra a página por um servidor, não como arquivo local.", false);
      console.error(e);
    }
  }

  function f16ParaF32(u16) {
    const out = new Float32Array(u16.length);
    for (let i = 0; i < u16.length; i++) {
      const h = u16[i], s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;
      out[i] = e === 0 ? s * f * 5.960464477539063e-8 : e === 31 ? (f ? NaN : s * Infinity) : s * Math.pow(2, e - 15) * (1 + f / 1024);
    }
    return out;
  }

  iniciar();
})();
</script>
